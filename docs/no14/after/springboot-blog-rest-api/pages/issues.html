</head>
<body>
  <header class="app-header">
    <a class="app-title" href="/">Javaシステム解析支援ツール V1</a>
    <a class="app-new" href="/">別のプロジェクトを解析</a>
  </header>
  <div class="app-body">
    <nav class="app-nav">
      <ul>
        <li><a href="/projects/c868524b-d319-4b96-8b8a-01851f264596">解析総覧</a></li>
        <li><a href="/projects/c868524b-d319-4b96-8b8a-01851f264596/architecture">アーキテクチャ・依存</a></li>
        <li><a href="/projects/c868524b-d319-4b96-8b8a-01851f264596/apis">API一覧 (18)</a></li>
        <li><a href="/projects/c868524b-d319-4b96-8b8a-01851f264596/er">ER図 (5)</a></li>
        <li><a href="/projects/c868524b-d319-4b96-8b8a-01851f264596/classes">クラス一覧 (41)</a></li>
        <li class="active"><a href="/projects/c868524b-d319-4b96-8b8a-01851f264596/issues">解析エラー (0)</a></li>
        <li><a href="/projects/c868524b-d319-4b96-8b8a-01851f264596/mybatis">MyBatis (0)</a></li>

      </ul>
    </nav>
    <main class="app-main">
  <h1>解析エラーレポート</h1>
  <form method="get" action="/projects/c868524b-d319-4b96-8b8a-01851f264596/issues" class="filters">
    <label>種類：
      <select name="kind" onchange="this.form.submit()">
        <option value="">すべて</option>
        <option value="SYNTAX_ERROR">構文エラー</option>
        <option value="UNRESOLVED_IMPORT">未解決 import</option>
        <option value="ENCODING_FALLBACK">文字コード</option>
        <option value="XML_PARSE_ERROR">XML 解析エラー</option>
        <option value="VIEW_SETTING_UNRESOLVED">View 設定</option>
        <option value="CIRCULAR_DEPENDENCY">循環依存</option>
      </select>
    </label>
    <label>重要度：
      <select name="severity" onchange="this.form.submit()">
        <option value="">すべて</option>
        <option value="ERROR">エラー</option>
        <option value="WARNING">警告</option>
      </select>
    </label>
    <noscript><button type="submit">表示</button></noscript>
  </form>
  
  <p class="note">検出されませんでした</p>
  

  <p class="note">コンパイル失敗を完全には検出しない。</p>
</main>
