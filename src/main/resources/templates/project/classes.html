<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, 'classes')}">
<head><title>クラス一覧 - Javaシステム解析支援ツール</title></head>
<body>
<main class="app-main" th:with="id=${project.projectId()}">
  <h1>クラス一覧</h1>
  <form method="get" th:action="@{/projects/{id}/classes(id=${id})}" class="filters">
    <label>パッケージ：
      <select name="package" data-auto-submit>
        <option value="">すべて</option>
        <option th:each="p : ${packageChoices}" th:value="${p}" th:text="${p}" th:selected="${p == selectedPackage}">pkg</option>
      </select>
    </label>
    <label>役割：
      <select name="role" data-auto-submit>
        <option value="">すべて</option>
        <option th:each="r : ${roleChoices}" th:value="${r}" th:text="${r}" th:selected="${r == selectedRole}">Service</option>
      </select>
    </label>
    <noscript><button type="submit">表示</button></noscript>
  </form>
  <th:block th:replace="~{fragments/parts :: dataTable(${classTable})}"></th:block>
</main>
</body>
</html>
