spring.application.name=java-system-analyzer

# FR-01 upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Let Tomcat read the rest of an oversized request so the error page reaches the browser
server.tomcat.max-swallow-size=-1
analyzer.upload.workspace-dir=workspace
analyzer.upload.max-extracted-size=200MB
analyzer.upload.max-entry-count=20000
